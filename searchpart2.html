<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Paper</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 50px;
    background-color: #f4f4f4;
  }
  .form-control {
    margin-bottom: 20px;
  }
  #message {
    color: red;
    font-weight: bold;
  }
  input[type="text"] {
    padding: 10px;
    width: 250px;
    font-size: 16px;
  }
  input[type="submit"] {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h2>Search Research Paper</h2>

<form id="searchForm">
  <div class="form-control">
    <input type="text" id="paperName" placeholder="Name of paper" required>
  </div>
  <input type="submit" value="Search">
</form>

<p id="message"></p>

<script>
  document.getElementById('searchForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Stop default form submission

    const paper = document.getElementById('paperName').value.trim().toLowerCase();

    if (paper === 'flood risk') {
      // Go to timeline.html
      window.location.href = 'timeline.html';
    } else {
      // Show not found message
      document.getElementById('message').textContent = 'Paper not found';
    }
  });
</script>

</body>
